<!doctype html>
<!--
  newyork24.uz — domen ildizi. VAQTINCHALIK bosh sahifa (2026-11-03): mijozlar uchun haqiqiy sahifa keyin alohida
  ishlab chiqiladi (docs/ROADMAP.md). Bu yerda xodimlar tizimiga havola YO'Q — u maxfiy yo'lda (UI_BASE).
  Vite build'ga kirmaydi — o'zi tayyor fayl. Serverda Apache beradi: sudo cp site/index.html /var/www/newyork24/
  (Apache'siz — backend `SITE_DIR`, standart ../ReactJS_NYFF/site).
-->
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New York Fast Food</title>
    <meta name="description" content="New York Fast Food — burger, hot-dog va boshqa fastfood. Tez orada." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23ffc20e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='900' fill='%23121212'%3ENY%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --taxi: #ffc20e;
        --coal: #121212;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--coal);
        color: #fff;
        font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      .glow {
        position: fixed;
        top: -18rem;
        right: -18rem;
        width: 40rem;
        height: 40rem;
        border-radius: 50%;
        background: var(--taxi);
        opacity: 0.18;
        filter: blur(90px);
        pointer-events: none;
      }
      main {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        padding: 2rem;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 1.1rem;
      }
      .mark {
        display: flex;
        width: 5.5rem;
        height: 5.5rem;
        align-items: center;
        justify-content: center;
        border-radius: 0.6rem;
        background: var(--taxi);
        color: var(--coal);
        font-size: 2.4rem;
        font-weight: 900;
        letter-spacing: -0.02em;
        box-shadow: 0 24px 48px -20px rgba(255, 194, 14, 0.55);
      }
      .words {
        text-align: left;
        line-height: 1.05;
      }
      .words strong {
        display: block;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 0.18em;
      }
      .words span {
        display: block;
        margin-top: 0.35rem;
        color: var(--taxi);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.42em;
      }
      .soon {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: 1.15rem;
        font-weight: 600;
      }
      .soon small {
        display: block;
        margin-top: 0.4rem;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      @media (max-width: 480px) {
        .mark {
          width: 4.25rem;
          height: 4.25rem;
          font-size: 1.85rem;
        }
        .words strong {
          font-size: 1.5rem;
        }
        .words span {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">NY</div>
        <div class="words">
          <strong>NEW YORK 2026</strong>
          <span>FAST FOOD</span>
        </div>
      </div>
      <p class="soon">
        Tez orada
        <small>Скоро · Coming soon</small>
      </p>
    </main>
  </body>
</html>
